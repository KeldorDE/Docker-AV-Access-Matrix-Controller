name: Release Build
on:
  push:
    branches:
      - main

  workflow_dispatch:

# Release-Builds werden nicht abgebrochen, damit jeder main-Commit ein Image erhält.
concurrency:
  group: release-build
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      image_tag: latest
    secrets: inherit

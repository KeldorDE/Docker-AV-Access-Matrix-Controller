name: Develop Build
on:
  push:
    branches:
      - develop

  workflow_dispatch:

# Läuft für denselben Branch nur einmal; überholte Läufe werden abgebrochen.
concurrency:
  group: develop-build
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      image_tag: dev
    secrets: inherit
